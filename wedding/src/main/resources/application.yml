app:
  data-dir: ${APP_DATA_DIR:./data}

spring:
  datasource:
    url: jdbc:sqlite:${app.data-dir}/wedding.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  sql:
    init:
      mode: always            # schema.sql(IF NOT EXISTS) + data.sql(INSERT OR IGNORE) 매 기동 실행
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      enabled: false
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      # /static 파일 URL 에 내용 해시를 붙이고(템플릿은 @{/static/..}) 1년 캐시. 파일이 바뀌면 URL 이 바뀐다
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  port: 8080
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}   # 운영(https) 은 compose 에서 true
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    enabled-by-default: false

# 번역 불필요한 값만. 문구는 label 테이블(data.sql)
wedding:
  base-url: ${WEDDING_BASE_URL:}
  date-time: 2027-03-27T14:30:00+09:00
  dating-start: 2025-05-04                  # 타임라인 시작(설계 §15-3)
  lat: 35.20805                             # 카카오 로컬 API 검색 결과 (드메르웨딩홀, 임방울대로 549)
  lng: 126.82179
  kakao-js-key: ${KAKAO_JS_KEY:}
  turnstile-site-key: ${TURNSTILE_SITE_KEY:}
  turnstile-secret: ${TURNSTILE_SECRET:}
  master-pw-hash: ${GUESTBOOK_MASTER_PW_HASH:}
  admin-id: ${ADMIN_ID:admin}
  storage:                                  # 설계 §15-10. 키가 비면 로컬 디스크(/files/**)
    endpoint: ${STORAGE_ENDPOINT:https://kr.ncloudstorage.com}
    region: ${STORAGE_REGION:kr}
    bucket: ${STORAGE_BUCKET:wedding}
    access-key: ${NCLOUD_ACCESS_KEY:}
    secret-key: ${NCLOUD_SECRET_KEY:}
  admin-pw-hash: ${ADMIN_PW_HASH:}          # 비어 있으면 어드민 로그인 불가
  address:
    ko: 광주광역시 광산구 임방울대로 549, CN타워 2층
    en: CN Tower 2F, 549 Imbangul-daero, Gwangsan-gu, Gwangju, Korea
    th: CN Tower ชั้น 2, 549 ถนนอิมบังอุล เขตควังซาน เมืองควังจู ประเทศเกาหลี
  account:                                  # 신부측은 해외계좌라 생략. 키를 추가하면 화면에 자동 노출
    groom: { holder: 윤희영, bank: 신한은행, number: 110-423-730255 }
