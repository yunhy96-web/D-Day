app:
  data-dir: ${APP_DATA_DIR:./data}

spring:
  datasource:
    url: jdbc:sqlite:${app.data-dir}/wedding.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  sql:
    init:
      mode: always            # schema.sql(IF NOT EXISTS) + data.sql(INSERT OR IGNORE) 매 기동 실행
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      enabled: false
  mvc:
    static-path-pattern: /static/**

server:
  port: 8080
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    enabled-by-default: false

# 번역 불필요한 값만. 문구는 label 테이블(data.sql)
wedding:
  base-url: ${WEDDING_BASE_URL:}
  date-time: 2027-03-27T14:30:00+09:00
  lat: 35.20805                             # 카카오 로컬 API 검색 결과 (드메르웨딩홀, 임방울대로 549)
  lng: 126.82179
  kakao-js-key: ${KAKAO_JS_KEY:}
  turnstile-site-key: ${TURNSTILE_SITE_KEY:}
  turnstile-secret: ${TURNSTILE_SECRET:}
  master-pw-hash: ${GUESTBOOK_MASTER_PW_HASH:}
  address:
    ko: 광주광역시 광산구 임방울대로 549 (도천동 147-29) CN타워 2층 베일리홀 (드메르 웨딩홀)
    en: Bailey Hall 2F, De Mer Wedding Hall, CN Tower, 549 Imbangul-daero, Gwangsan-gu, Gwangju, Korea
    th: เบลีย์ฮอลล์ ชั้น 2 เดอ แมร์ เวดดิ้งฮอลล์ CN Tower 549 ถนนอิมบังอุล เขตควังซาน เมืองควังจู ประเทศเกาหลี
  account:                                  # 신부측은 해외계좌라 생략. 키를 추가하면 화면에 자동 노출
    groom: { holder: 윤희영, bank: 신한은행, number: 110-423-730255 }
