<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>어드민</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" th:attr="nonce=${cspNonce}"></script>
  <script th:attr="nonce=${cspNonce}">
    const v = n => `rgb(var(--${n}) / <alpha-value>)`;
    tailwind.config = { theme: { extend: { colors: { mist:v('mist'), ink:v('ink'), sky:v('sky'), jasmine:v('jasmine') } } } }
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<!-- 설계 §15-1. 나 혼자 쓰는 화면이라 한국어 하드코딩 허용 -->
<body class="min-h-screen" th:attr="data-month-min=${monthMin},data-month-max=${monthMax}">
<main class="max-w-[640px] mx-auto px-5 py-10 text-[14px]">

  <section th:if="${!loggedIn}" class="max-w-[280px] mx-auto pt-24 text-center">
    <h1 class="text-xl font-semibold">어드민</h1>
    <form data-login class="mt-8">
      <input name="username" autocomplete="username" class="field" placeholder="아이디" required>
      <input name="password" type="password" autocomplete="current-password" class="field" placeholder="비밀번호" required>
      <button class="mt-6 px-6 py-2.5 rounded-full bg-sky text-white">로그인</button>
      <p data-login-msg class="mt-3 text-ink/60 min-h-[1rem]"></p>
    </form>
  </section>

  <th:block th:if="${loggedIn}">
    <header class="flex items-baseline justify-between">
      <h1 class="text-xl font-semibold">어드민</h1>
      <span class="space-x-4"><a href="/" class="text-sky">청첩장</a><button type="button" data-logout class="text-ink/50">로그아웃</button></span>
    </header>
    <nav class="mt-6 flex gap-5 border-b border-ink/10 text-[15px]">
      <button type="button" data-tab="photos" class="pb-2 border-b-2 -mb-px">사진</button>
      <button type="button" data-tab="timeline" class="pb-2 border-b-2 -mb-px">타임라인</button>
      <button type="button" data-tab="quiz" class="pb-2 border-b-2 -mb-px">퀴즈</button>
      <button type="button" data-tab="guestbook" class="pb-2 border-b-2 -mb-px">방명록</button>
    </nav>

    <!-- 업로드 진행 (사진·타임라인 공통) -->
    <div data-up class="hidden mt-6 p-4 rounded-xl bg-jasmine">
      <p class="flex justify-between"><b data-up-count class="tabular"></b><span data-up-summary class="text-ink/60"></span></p>
      <div class="up-bar mt-2"><i data-up-total></i></div>
      <ul data-up-list class="mt-3 space-y-2 max-h-64 overflow-y-auto text-[13px]"></ul>
      <button type="button" data-up-retry class="hidden mt-3 text-sky">실패한 것만 다시</button>
    </div>

    <!-- 갤러리·월드컵 사진 -->
    <section data-panel="photos" class="mt-8">
      <p data-photo-stat class="text-ink/60"></p>
      <form data-photo-form class="mt-4 flex flex-wrap gap-4 items-center p-4 rounded-xl bg-jasmine">
        <input type="file" name="files" accept="image/*" multiple required>
        <label class="flex gap-1.5 items-center"><input type="checkbox" name="worldcup" checked> 월드컵에 포함</label>
        <button class="px-5 py-2 rounded-full bg-sky text-white">올리기</button>
      </form>
      <p class="mt-3 text-ink/50">원본은 비공개로 보관하고, 하객에겐 2560px 보기용·600px 썸네일만 나간다. 길게 눌러 끌면 순서가 바뀐다. 1번이 메인(첫 화면·카톡 미리보기).</p>
      <ol data-photo-grid class="mt-4 grid grid-cols-3 sm:grid-cols-4 gap-3"></ol>
    </section>

    <!-- 타임라인 -->
    <section data-panel="timeline" class="mt-8">
      <form data-tl-form class="space-y-3 p-4 rounded-xl bg-jasmine">
        <div class="flex gap-3 flex-wrap">
          <input type="month" name="month" required class="p-2 rounded border border-ink/15 bg-transparent" th:attr="min=${monthMin},max=${monthMax}">
          <input name="caption" maxlength="60" placeholder="한 줄 설명 (선택)" class="flex-1 min-w-[160px] p-2 rounded border border-ink/15 bg-transparent">
        </div>
        <input type="file" name="files" accept="image/*" multiple required>
        <button class="px-5 py-2 rounded-full bg-sky text-white">올리기</button>
      </form>
      <p class="mt-3 text-ink/50">긴 변 2560px 로 줄여서 올라간다. 여러 장 고르면 같은 달로 들어간다.</p>
      <div data-tl-list class="mt-4"></div>
    </section>

    <!-- 퀴즈 -->
    <section data-panel="quiz" class="mt-8">
      <p data-quiz-stat class="text-ink/55"></p>
      <form data-quiz-form class="mt-4 space-y-3 p-4 rounded-xl bg-jasmine">
        <input type="hidden" name="quizId">
        <textarea name="question" rows="2" maxlength="200" required placeholder="문제" class="w-full p-2 rounded border border-ink/15 bg-transparent"></textarea>
        <p class="text-ink/55">보기 (2~4개, 정답에 체크)</p>
        <div data-choice-inputs class="space-y-2"></div>
        <div class="flex gap-4 items-center">
          <label>배점 <select name="points" class="ml-1 p-1 rounded border border-ink/15 bg-transparent"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
          <input name="hint" maxlength="200" placeholder="힌트 (개발자 도구에서만 보임)" class="flex-1 p-2 rounded border border-ink/15 bg-transparent">
        </div>
        <div class="flex gap-4 items-center">
          <button class="px-5 py-2 rounded-full bg-sky text-white" data-quiz-submit>추가</button>
          <button type="button" data-quiz-cancel class="hidden text-ink/50">취소</button>
          <span data-quiz-msg class="text-ink/60"></span>
        </div>
      </form>
      <ol data-quiz-list class="mt-4"></ol>
    </section>

    <!-- 방명록 -->
    <section data-panel="guestbook" class="mt-8">
      <p class="text-ink/50">숨긴 글은 하객 화면에서 사라진다(되돌리기 가능). 사진 × 는 파일까지 지운다.</p>
      <ol data-gb-list class="mt-4"></ol>
      <button type="button" data-gb-more class="hidden mt-4 text-sky">더 보기</button>
    </section>
  </th:block>
</main>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer th:attr="nonce=${cspNonce}"></script>
<script src="/static/upload.js" defer th:attr="nonce=${cspNonce}"></script>
<script src="/static/admin.js" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
