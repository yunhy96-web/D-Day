<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title th:text="${t['og.title']}">Wedding</title>
  <meta property="og:type" content="website">
  <meta property="og:title" th:content="${t['og.title']}">
  <meta property="og:description" th:content="${t['og.description']}">
  <meta property="og:url" th:content="${p.baseUrl} + '/'">
  <meta th:if="${mainPhoto != null}" property="og:image" th:content="${p.baseUrl} + ${mainPhoto}">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;600&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" th:attr="nonce=${cspNonce}"></script>
  <script th:attr="nonce=${cspNonce}">
    const v = n => `rgb(var(--${n}) / <alpha-value>)`;
    tailwind.config = { theme: { extend: { colors: { mist:v('mist'), ink:v('ink'), sky:v('sky'), cloud:v('cloud'), jasmine:v('jasmine'), night:'#0F141B' } } } }
  </script>
  <script th:attr="nonce=${cspNonce}">
    (function () { let t = null; try { t = localStorage.theme; } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t; })();
  </script>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/app.css">
  <script id="labels" type="application/json" th:utext="${labelsJson}">{}</script>
</head>
<body>

<!-- 우상단: 테마 · 언어. 글자만, 선택된 언어는 밑줄 -->
<div th:fragment="controls" class="flex items-center gap-4 text-[13px]">
  <button type="button" data-theme-toggle class="text-ink/60" aria-label="theme">
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
  </button>
  <span class="flex gap-3">
    <button type="button" data-lang="ko" class="lang" th:attr="aria-pressed=${lang=='ko'}">KO</button>
    <button type="button" data-lang="en" class="lang" th:attr="aria-pressed=${lang=='en'}">EN</button>
    <button type="button" data-lang="th" class="lang" th:attr="aria-pressed=${lang=='th'}">TH</button>
  </span>
</div>

<!-- 메인 우상단 고정 -->
<div th:fragment="langToggle" class="fixed top-3 right-4 z-40 px-3 py-1.5 rounded-full bg-mist/70 backdrop-blur"><div th:replace="~{fragments/layout :: controls}"></div></div>

<!-- 컨텐츠 페이지 상단: 뒤로 + 제목 + 컨트롤 -->
<header th:fragment="topbar(titleKey)" class="sticky top-0 z-30 bg-mist/85 backdrop-blur">
  <div class="max-w-[420px] mx-auto flex items-center h-14 px-5">
    <a href="/" class="p-2 -ml-2 text-ink/70" th:attr="aria-label=${t['nav.back']}" data-i18n-aria="nav.back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="serif text-[17px] ml-1 flex-1" th:text="${t[titleKey]}" th:attr="data-i18n=${titleKey}">title</h1>
    <div th:replace="~{fragments/layout :: controls}"></div>
  </div>
</header>

<!-- 컨텐츠 페이지 하단: 청첩장으로 돌아가는 글자 링크 하나 -->
<nav th:fragment="bottomNav" class="max-w-[420px] mx-auto px-5 pt-10 pb-14 text-center">
  <a href="/" class="text-[13px] text-ink/50">← <span data-i18n="nav.home" th:text="${t['nav.home']}">home</span></a>
</nav>

<!-- 푸터 -->
<footer th:fragment="footer" class="max-w-[420px] mx-auto px-5 pt-16 pb-14 text-[13px] text-ink/50 text-center">
  <p><span data-online data-i18n="footer.online" data-args="0" th:text="${t['footer.online']}">online</span></p>
  <p class="mt-1"><span data-total data-i18n="footer.total" data-args="0" th:text="${t['footer.total']}">total</span></p>
  <button type="button" data-share class="mt-6 text-sky" data-i18n="btn.share" th:text="${t['btn.share']}">share</button>
</footer>

<!-- 허브 아이콘: 1.5px 선, 하늘색 -->
<th:block th:fragment="icon(name)">
  <svg th:if="${name=='worldcup'}" class="text-sky" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="8" height="11" rx="1.5"/><rect x="13" y="8" width="8" height="11" rx="1.5"/><path d="M7 16v3M17 19v2"/></svg>
  <svg th:if="${name=='guestbook'}" class="text-sky" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M12.5 7.5l4 4"/><path d="M4 20l16 0" opacity=".35"/></svg>
  <svg th:if="${name=='gallery'}" class="text-sky" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>
  <svg th:if="${name=='quiz'}" class="text-sky" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2"/><path d="M12 17h.01"/></svg>
  <svg th:if="${name=='timeline'}" class="text-sky" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 102.5-6"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>
  <svg th:if="${name=='map'}" class="text-sky" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
</th:block>

<th:block th:fragment="scripts"><script src="/static/app.js" defer th:attr="nonce=${cspNonce}"></script></th:block>
</body>
</html>
