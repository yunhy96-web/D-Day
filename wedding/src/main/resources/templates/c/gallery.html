<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="paper min-h-screen" th:attr="data-datetime=${p.dateTime}">
<header th:replace="~{fragments/layout :: topbar('content.gallery.title')}"></header>

<main class="max-w-[420px] mx-auto px-3 pt-4">
  <p th:if="${photos.isEmpty()}" class="mt-10 text-center text-sm text-ink/50" data-i18n="gallery.empty" th:text="${t['gallery.empty']}">empty</p>
  <div class="grid grid-cols-3 gap-[1px] bg-gold border border-gold">
    <!-- 마지막 줄이 3칸을 못 채우면 마지막 사진이 남은 칸을 가로로 채움 (빈 금색 칸 방지) -->
    <button type="button" th:each="u, s : ${photos}" th:attr="data-idx=${s.index}" class="aspect-square bg-jasmine overflow-hidden"
            th:classappend="${s.last and photos.size() % 3 == 2} ? 'col-span-2 !aspect-[2/1]' : (${s.last and photos.size() % 3 == 1} ? 'col-span-3 !aspect-[3/1]' : '')">
      <img th:src="${u}" alt="" loading="lazy" class="w-full h-full object-cover">
    </button>
  </div>

  <!-- 전체화면 뷰어: 먹색 배경 + 금색 선 아이콘. 스와이프(scroll-snap)·화살표 버튼·키보드 모두 지원 -->
  <dialog data-viewer class="bg-night p-0 w-screen h-[100svh] max-w-none max-h-none outline-none backdrop:bg-night">
    <div class="absolute top-0 inset-x-0 z-20 h-14 flex items-center justify-between px-4 bg-gradient-to-b from-night/80 to-transparent">
      <span class="serif text-gold text-sm tabular tracking-widest" data-counter>1 / 1</span>
      <button type="button" data-close class="p-2 -mr-2 text-gold/90 hover:text-gold" aria-label="close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <button type="button" data-prev class="absolute left-0 top-0 bottom-0 z-10 w-14 flex items-center justify-start pl-2 text-gold/70 hover:text-gold" aria-label="previous">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" data-next class="absolute right-0 top-0 bottom-0 z-10 w-14 flex items-center justify-end pr-2 text-gold/70 hover:text-gold" aria-label="next">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div data-strip class="h-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar">
      <figure th:each="u : ${photos}" class="shrink-0 w-screen h-full snap-center flex items-center justify-center m-0 px-3 py-16">
        <img th:attr="data-src=${u}" alt="" class="max-w-full max-h-full object-contain shadow-2xl">
      </figure>
    </div>
    <div class="absolute bottom-0 inset-x-0 z-10 h-14 flex items-end justify-center pb-5 bg-gradient-to-t from-night/80 to-transparent">
      <div class="w-32 h-px bg-gold/30"><div data-progress class="h-px bg-gold transition-all"></div></div>
    </div>
  </dialog>
</main>

<nav th:replace="~{fragments/layout :: bottomNav}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:attr="nonce=${cspNonce}">
  (function () {
    const dlg = document.querySelector('[data-viewer]'), strip = document.querySelector('[data-strip]');
    const figs = [...strip.children], n = figs.length;
    const counter = dlg.querySelector('[data-counter]'), bar = dlg.querySelector('[data-progress]');
    let cur = 0;
    const load = i => [i - 1, i, i + 1].filter(j => figs[j]).forEach(j => { const im = figs[j].querySelector('img'); if (!im.src) im.src = im.dataset.src; });
    const go = (i, smooth) => { cur = Math.max(0, Math.min(n - 1, i)); load(cur); figs[cur].scrollIntoView({ inline: 'center', behavior: smooth ? 'smooth' : 'instant' }); };
    const update = () => { counter.textContent = (cur + 1) + ' / ' + n; bar.style.width = ((cur + 1) / n * 100) + '%'; };
    document.querySelectorAll('[data-idx]').forEach(b => b.addEventListener('click', () => {
      dlg.showModal(); go(+b.dataset.idx, false); update(); W.track('gallery.open', b.dataset.idx);
    }));
    strip.addEventListener('scroll', () => { const i = Math.round(strip.scrollLeft / strip.clientWidth); if (i !== cur) { cur = i; load(cur); update(); } }, { passive: true });
    dlg.querySelector('[data-prev]').addEventListener('click', () => go(cur - 1, true));
    dlg.querySelector('[data-next]').addEventListener('click', () => go(cur + 1, true));
    dlg.querySelector('[data-close]').addEventListener('click', () => dlg.close());
    dlg.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(cur - 1, true); if (e.key === 'ArrowRight') go(cur + 1, true); });
    strip.addEventListener('click', e => { if (e.target === e.currentTarget || e.target.tagName === 'FIGURE') dlg.close(); });
  })();
</script>
</body>
</html>
