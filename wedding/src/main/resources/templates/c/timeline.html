<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="min-h-screen" th:attr="data-datetime=${p.dateTime},data-dating-start=${p.datingStart}">
<header th:replace="~{fragments/layout :: topbar('content.timeline.title')}"></header>
<script id="timeline" type="application/json" th:utext="${timelineJson}">[]</script>

<main class="max-w-[420px] mx-auto px-7 pt-6 text-center">
  <p class="pt-6 text-[13px] text-ink/50 tabular" data-days></p>
  <p class="serif text-[30px] mt-2 tabular" data-month></p>

  <div data-photos class="mt-6 -mx-7 px-7 flex gap-3 overflow-x-auto snap-x snap-mandatory no-scrollbar"></div>
  <p data-empty class="hidden mt-10 text-[14px] text-ink/45" data-i18n="timeline.empty" th:text="${t['timeline.empty']}">empty</p>

  <!-- 월 단위 눈금. 사진 있는 달만 진하게, 손을 움직이면 가장 가까운 사진 달로 붙는다 -->
  <div class="mt-10">
    <div class="relative h-4" data-ticks></div>
    <input type="range" min="0" step="1" value="0" data-range class="tl-range w-full" th:attr="aria-label=${t['timeline.drag']}">
    <div class="relative h-5 mt-1 text-[11px] text-ink/45 tabular" data-years></div>
    <p class="mt-4 text-[12px] text-ink/45" data-i18n="timeline.drag" th:text="${t['timeline.drag']}">drag</p>
  </div>
</main>

<nav th:replace="~{fragments/layout :: bottomNav}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/static/timeline.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
