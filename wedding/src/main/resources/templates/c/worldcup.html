<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="min-h-screen" th:attr="data-datetime=${p.dateTime}">
<header th:replace="~{fragments/layout :: topbar('content.worldcup.title')}"></header>
<script id="photos" type="application/json" th:utext="${photosJson}">[]</script>

<main class="max-w-[420px] mx-auto px-7 pt-6 text-center">
  <section data-step="intro" class="pt-6">
    <p class="text-[15px] leading-8 whitespace-pre-line" data-i18n="worldcup.intro" th:text="${t['worldcup.intro']}">intro</p>
    <p class="mt-3 text-[13px] text-ink/50 tabular" data-participants></p>
    <button type="button" data-start class="mt-8 px-8 py-3 rounded-full bg-sky text-white text-[15px]" data-i18n="worldcup.start" th:text="${t['worldcup.start']}">start</button>
    <p data-not-enough class="hidden mt-6 text-[14px] text-ink/60" data-i18n="worldcup.not_enough" th:text="${t['worldcup.not_enough']}">no photos</p>
  </section>

  <section data-step="match" class="hidden">
    <p class="text-[13px] text-ink/50 tabular" data-progress></p>
    <p class="serif text-[19px] mt-1" data-i18n="worldcup.choose" th:text="${t['worldcup.choose']}">choose</p>
    <div class="mt-5 grid grid-cols-2 gap-2">
      <button type="button" data-side="0" class="wc-card rounded-xl bg-jasmine"><img alt=""></button>
      <button type="button" data-side="1" class="wc-card rounded-xl bg-jasmine"><img alt=""></button>
    </div>
    <div class="mt-5 h-px bg-ink/10"><div data-bar class="h-px bg-sky transition-all"></div></div>
  </section>

  <section data-step="result" class="hidden">
    <p class="serif text-[19px]" data-i18n="worldcup.result_title" th:text="${t['worldcup.result_title']}">your #1</p>
    <div class="mt-5 w-full aspect-[3/4] overflow-hidden rounded-xl bg-jasmine"><img data-champion alt="" class="w-full h-full object-cover"></div>
    <p class="mt-5 text-[14px] space-x-5">
      <button type="button" data-share-result class="text-sky" data-i18n="worldcup.share" th:text="${t['worldcup.share']}">share</button>
      <button type="button" data-retry class="text-ink/50" data-i18n="worldcup.retry" th:text="${t['worldcup.retry']}">retry</button>
    </p>
    <p class="serif text-[19px] mt-14" data-i18n="worldcup.ranking_title" th:text="${t['worldcup.ranking_title']}">top3</p>
    <p class="mt-1 text-[13px] text-ink/50 tabular" data-participants></p>
    <ol data-ranking class="mt-4 grid grid-cols-3 gap-2"></ol>
  </section>
</main>

<nav th:replace="~{fragments/layout :: bottomNav}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="/static/worldcup.js" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
