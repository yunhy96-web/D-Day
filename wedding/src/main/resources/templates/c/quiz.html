<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="min-h-screen" th:attr="data-datetime=${p.dateTime}">
<header th:replace="~{fragments/layout :: topbar('content.quiz.title')}"></header>

<main class="max-w-[420px] mx-auto px-7 pt-6 text-center">
  <!-- 난이도 고르기: 채움 버튼 없이 큰 글자 목록 -->
  <section data-step="intro" class="pt-6">
    <p class="text-[15px] leading-8 whitespace-pre-line" data-i18n="quiz.intro" th:text="${t['quiz.intro']}">intro</p>
    <ul class="mt-8">
      <li th:each="lv : ${ {'easy','normal','hard'} }" class="border-b border-ink/10 last:border-0">
        <button type="button" th:attr="data-level=${lv}" class="w-full py-5">
          <span class="serif block text-[22px]" th:attr="data-i18n='quiz.level.'+${lv}" th:text="${t['quiz.level.'+lv]}">level</span>
          <span class="block mt-1 text-[13px] text-ink/50" th:attr="data-i18n='quiz.level.'+${lv}+'_desc'" th:text="${t['quiz.level.'+lv+'_desc']}">desc</span>
        </button>
      </li>
    </ul>
    <p data-msg class="mt-6 text-[14px] text-ink/60 min-h-[1rem]"></p>
  </section>

  <section data-step="question" class="hidden pt-6">
    <p class="text-[13px] text-ink/50 tabular" data-progress></p>
    <p class="serif text-[22px] leading-9 mt-3 break-keep" data-question></p>
    <ol data-choices class="mt-8"></ol>
    <div class="mt-6 h-px bg-ink/10"><div data-bar class="h-px bg-sky transition-all"></div></div>
  </section>

  <section data-step="result" class="hidden pt-6">
    <p class="text-[13px] text-ink/50" data-level-name></p>
    <p class="serif text-[19px] mt-1" data-i18n="quiz.result_title" th:text="${t['quiz.result_title']}">score</p>
    <p class="serif text-[44px] mt-4 tabular" data-score></p>
    <p class="mt-2 text-[15px]" data-comment></p>
    <ol data-results class="mt-10 text-left"></ol>
    <button type="button" data-retry class="mt-10 px-8 py-3 rounded-full bg-sky text-white text-[15px]" data-i18n="quiz.retry" th:text="${t['quiz.retry']}">retry</button>
  </section>
</main>

<nav th:replace="~{fragments/layout :: bottomNav}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/static/quiz.js}" defer th:attr="nonce=${cspNonce}"></script>
</body>
</html>
