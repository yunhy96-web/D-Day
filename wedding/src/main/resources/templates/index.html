<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="min-h-screen" th:attr="data-datetime=${p.dateTime}">
<div th:replace="~{fragments/layout :: langToggle}"></div>

<main class="max-w-[420px] mx-auto">

  <!-- 인트로 -->
  <section class="relative h-[100svh] min-h-[560px] overflow-hidden">
    <img th:if="${mainPhoto != null}" th:src="${mainPhoto}" alt="" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-mist"></div>
    <div class="absolute inset-x-0 bottom-0 px-7 pb-12 text-center">
      <p class="serif text-[32px] leading-tight">
        <span data-i18n="intro.groom" th:text="${t['intro.groom']}">A</span>
        <span class="text-ink/40 text-2xl mx-1">&amp;</span>
        <span data-i18n="intro.bride" th:text="${t['intro.bride']}">B</span>
      </p>
      <p class="mt-5 text-[15px]"><span data-date-long></span> <span data-date-time></span></p>
      <p class="serif mt-5 text-xl text-sky tabular" data-dday></p>
    </div>
  </section>

  <!-- 인사말 -->
  <section id="greeting" class="px-7 pt-20 text-center reveal">
    <h2 class="serif text-xl" data-i18n="greeting.title" th:text="${t['greeting.title']}">title</h2>
    <p class="mt-6 text-[15px] leading-8 whitespace-pre-line text-ink/85" data-i18n="greeting.body" th:text="${t['greeting.body']}">body</p>
    <div class="mt-10 space-y-4 text-[14px]">
      <p><span class="block text-[12px] text-ink/45" data-i18n="greeting.groom_side" th:text="${t['greeting.groom_side']}">groom</span><span data-i18n="greeting.groom_parents" th:text="${t['greeting.groom_parents']}">parents</span></p>
      <p><span class="block text-[12px] text-ink/45" data-i18n="greeting.bride_side" th:text="${t['greeting.bride_side']}">bride</span><span data-i18n="greeting.bride_parents" th:text="${t['greeting.bride_parents']}">parents</span></p>
    </div>
  </section>

  <!-- 일시 -->
  <section id="date" class="px-7 pt-20 text-center reveal">
    <h2 class="serif text-xl" data-i18n="date.title" th:text="${t['date.title']}">when</h2>
    <p class="mt-5 text-[15px]"><span data-date-long></span> <span data-date-time></span></p>
    <!-- 요일과 날짜를 한 그리드에 (두 그리드로 나누면 정렬이 어긋남) -->
    <div class="mt-6 grid grid-cols-7 gap-y-2 text-[13px] tabular w-[280px] mx-auto [&>span]:h-7 [&>span]:leading-7 [&>span]:w-7 [&>span]:mx-auto">
      <span class="text-ink/40">S</span><span class="text-ink/40">M</span><span class="text-ink/40">T</span><span class="text-ink/40">W</span><span class="text-ink/40">T</span><span class="text-ink/40">F</span><span class="text-ink/40">S</span>
      <template data-calendar></template>
    </div>
    <p class="mt-6 text-[13px] text-ink/50 tabular" data-countdown></p>
  </section>

  <!-- 장소 -->
  <section id="venue" class="px-7 pt-20 text-center reveal">
    <h2 class="serif text-xl" data-i18n="venue.title" th:text="${t['venue.title']}">where</h2>
    <p class="mt-5 text-[15px]"><span data-i18n="venue.name" th:text="${t['venue.name']}">venue</span> <span data-i18n="venue.hall" th:text="${t['venue.hall']}">hall</span></p>
    <p class="mt-1 text-[14px] text-ink/70" th:text="${p.address[lang] ?: p.address['ko']}" th:attr="data-copy=${p.address[lang] ?: p.address['ko']}">address</p>
    <p class="mt-4 text-[14px]"><a href="/c/map" data-content-link="map" class="text-sky" data-i18n="btn.directions" th:text="${t['btn.directions']}">directions</a></p>
  </section>

  <!-- 사진 -->
  <section id="gallery" class="px-5 pt-20 text-center reveal">
    <h2 class="serif text-xl" data-i18n="gallery.title" th:text="${t['gallery.title']}">moments</h2>
    <div th:if="${!previewPhotos.isEmpty()}" class="jogakbo mt-5">
      <a th:each="u : ${previewPhotos}" href="/c/gallery" data-content-link="gallery"><img th:src="${u}" alt="" loading="lazy"></a>
    </div>
    <p class="mt-4 text-[14px]"><a href="/c/gallery" data-content-link="gallery" class="text-sky"><span data-i18n="gallery.more" th:text="${t['gallery.more']}">more</span> · <span data-i18n="gallery.count" th:attr="data-args=${photoCount}" th:text="${#strings.replace(t['gallery.count'],'{0}',photoCount)}">n</span></a></p>
  </section>

  <!-- 함께 즐기기: 사진 썸네일 + 제목 목록 -->
  <section id="hub" class="px-7 pt-20 text-center reveal">
    <h2 class="serif text-xl" data-i18n="hub.title" th:text="${t['hub.title']}">hub</h2>
    <ul class="mt-2">
      <li th:each="c : ${cards}" class="border-b border-ink/10 last:border-0">
        <a th:href="${c.path}" th:attr="data-content-link=${c.key}" class="flex items-center justify-center gap-4 py-5 text-left">
          <span class="shrink-0"><th:block th:replace="~{fragments/layout :: icon(${c.key})}"></th:block></span>
          <span class="min-w-0 w-44">
            <span class="serif block text-[17px]" th:attr="data-i18n='content.'+${c.key}+'.title'" th:text="${t['content.'+c.key+'.title']}">title</span>
            <span class="block text-[13px] text-ink/55 mt-0.5 truncate" th:attr="data-i18n='content.'+${c.key}+'.desc'" th:text="${t['content.'+c.key+'.desc']}">desc</span>
          </span>
        </a>
      </li>
    </ul>
    <div th:if="${!guestbookPreview.isEmpty()}" class="mt-3 space-y-1.5">
      <p th:each="g : ${guestbookPreview}" class="text-[13px] text-ink/60 truncate"><span class="text-ink/85" th:text="${g.name}">name</span> · <span th:text="${g.message}">msg</span></p>
    </div>
  </section>

  <!-- 마음 전하실 곳 -->
  <section id="account" class="px-7 pt-20 text-center reveal">
    <h2 class="serif text-xl" data-i18n="account.title" th:text="${t['account.title']}">gift</h2>
    <p class="mt-4 text-[14px] text-ink/70" data-i18n="account.intro" th:text="${t['account.intro']}">intro</p>
    <dl class="mt-6 space-y-5 text-[14px]">
      <div th:each="a : ${p.account}">
        <dt class="text-ink/45" th:attr="data-i18n='account.'+${a.key}" th:text="${t['account.'+a.key]}">side</dt>
        <dd class="mt-1 flex items-center justify-center gap-3">
          <span class="tabular"><span th:text="${a.value.bank}">bank</span> <span th:text="${a.value.number}">number</span> <span class="text-ink/70" th:text="${a.value.holder}">holder</span></span>
          <button type="button" class="text-sky text-[13px]" th:attr="data-copy=${a.value.bank + ' ' + a.value.number + ' ' + a.value.holder},data-track='account.copy'" data-i18n="btn.copy" th:text="${t['btn.copy']}">copy</button>
        </dd>
      </div>
    </dl>
  </section>

  <div th:replace="~{fragments/layout :: footer}"></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
