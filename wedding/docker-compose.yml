# Pi 배포. docker-compose(v1) up -d --build
# 외부 노출은 tut-cloudflared ingress(wedding.thaiuniontour.com → http://wedding-app:8080) 로만.
services:
  app:
    build: .
    image: wedding-app
    container_name: wedding-app
    env_file: .env
    environment:
      APP_DATA_DIR: /data
      COOKIE_SECURE: "true"
    volumes: ["./data:/data"]
    networks: [docker_default]
    read_only: true
    tmpfs: ["/tmp:rw,exec,size=64m"]   # sqlite-jdbc 가 네이티브 .so 를 /tmp 에 풀어 로드한다. 기본 tmpfs 는 noexec
    cap_drop: [ALL]
    mem_limit: 512m
    restart: always
networks:
  docker_default:
    external: true
