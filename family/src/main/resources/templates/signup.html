<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-font=${font},data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${L['signup.title']})}"></head>
<body class="min-h-[100dvh]">
<div class="wrap pt-4 flex items-center justify-between">
  <a href="/login" class="-ml-2 p-2" th:aria-label="${L['common.back']}"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></a>
  <div th:replace="~{fragments/layout :: prefbar}"></div>
</div>
<main class="wrap pt-6 pb-16">
  <h1 class="text-2xl font-bold" th:text="${L['signup.title']}">가입 신청</h1>
  <p class="mt-2 text-muted" th:text="${L['signup.desc']}">관리자가 승인하면 사용할 수 있어요.</p>
  <form data-signup class="mt-8 space-y-5" novalidate>
    <div><label class="label" for="name" th:text="${L['signup.name']}">이름</label>
      <input id="name" name="name" class="field" maxlength="20" autocomplete="nickname" th:placeholder="${L['signup.namePh']}" required></div>
    <div><label class="label" for="loginId" th:text="${L['login.id']}">아이디</label>
      <input id="loginId" name="loginId" class="field" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <p class="mt-1.5 text-sm text-muted" th:text="${L['signup.idHint']}">영문 소문자·숫자 4~20자</p></div>
    <div><label class="label" for="password" th:text="${L['login.password']}">비밀번호</label>
      <input id="password" name="password" type="password" class="field" autocomplete="new-password" required>
      <p class="mt-1.5 text-sm text-muted" th:text="${L['signup.pwHint']}">8자 이상</p></div>
    <p data-msg class="min-h-[1.5rem] text-sm text-red-600" role="alert"></p>
    <button class="btn-primary w-full" th:text="${L['signup.submit']}">신청하기</button>
  </form>
</main>
<script th:nonce="${nonce}">
document.querySelector('[data-signup]').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = f.querySelector('[data-msg]'), btn = f.querySelector('button');
  btn.disabled = true; msg.textContent = '';
  const r = await App.api('POST', '/api/signup', { name: f.name.value, loginId: f.loginId.value, password: f.password.value });
  btn.disabled = false;
  if (r.ok) location.href = r.json.next; else msg.textContent = App.errText(r);
});
</script>
</body>
</html>
