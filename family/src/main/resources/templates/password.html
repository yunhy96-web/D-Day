<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-font=${font},data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${L['password.title']})}"></head>
<body class="min-h-[100dvh]">
<main class="wrap pt-16 pb-16">
  <h1 class="text-2xl font-bold" th:text="${L['password.title']}">새 비밀번호를 정해 주세요</h1>
  <p class="mt-2 text-muted" th:text="${L['password.desc']}">임시 비밀번호로 들어왔어요.</p>
  <form data-pw class="mt-8 space-y-5" novalidate>
    <div><label class="label" for="current" th:text="${L['password.current']}">지금 비밀번호</label>
      <input id="current" name="current" type="password" class="field" autocomplete="current-password" required></div>
    <div><label class="label" for="next" th:text="${L['password.next']}">새 비밀번호</label>
      <input id="next" name="next" type="password" class="field" autocomplete="new-password" required>
      <p class="mt-1.5 text-sm text-muted" th:text="${L['signup.pwHint']}">8자 이상</p></div>
    <p data-msg class="min-h-[1.5rem] text-sm text-red-600" role="alert"></p>
    <button class="btn-primary w-full" th:text="${L['password.submit']}">바꾸기</button>
  </form>
  <button type="button" data-logout class="btn w-full mt-2 text-muted" th:text="${L['common.logout']}">나가기</button>
</main>
<script th:nonce="${nonce}">
document.querySelector('[data-pw]').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = f.querySelector('[data-msg]');
  const r = await App.api('PUT', '/api/me/password', { current: f.current.value, next: f.next.value });
  if (r.ok) location.href = '/'; else msg.textContent = App.errText(r);
});
</script>
</body>
</html>
