<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-font=${font},data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(null)}"></head>
<body class="pb-tab">
<header class="wrap pt-6 pb-2 flex items-center justify-between">
  <h1 class="text-2xl font-bold" th:text="${familyName}">우리 가족</h1>
  <a th:if="${pendingCount != null and pendingCount > 0}" href="/admin" class="px-3 py-1.5 rounded-full bg-accent text-on-accent text-sm font-semibold"
     th:text="${#strings.replace(L['feed.pending'], '{0}', pendingCount)}">승인 대기 1명</a>
</header>

<!-- 오늘 근무 (설계 §5) -->
<section th:if="${!today.isEmpty()}" class="mt-2">
  <a href="/calendar?view=family" class="wrap flex gap-2 overflow-x-auto no-scrollbar pb-1">
    <span th:each="s : ${today}" class="shrink-0 flex items-center gap-2 pl-2 pr-3.5 py-2 rounded-2xl bg-card border border-line/60" th:classappend="'c-' + ${s.color}">
      <span class="avatar solid w-8 h-8 text-sm" th:text="${#strings.substring(s.name, 0, 1)}">아</span>
      <span class="leading-tight">
        <span class="block text-sm text-muted" th:text="${s.name}">아빠</span>
        <span class="block font-semibold">
          <span th:text="${s.typeName != null ? s.typeName : s.note}">야간</span>
          <span th:if="${s.startTime != null}" class="font-normal text-muted text-sm" th:text="${f.range(s.startTime, s.endTime)}">20:00–08:00</span>
        </span>
      </span>
    </span>
  </a>
</section>

<nav class="wrap mt-4">
  <div class="seg">
    <a href="/" class="flex-1 min-h-tap rounded-xl flex items-center justify-center font-medium" th:classappend="${kind == 'all'} ? 'bg-card text-fg shadow-sm' : 'text-muted'" th:text="${L['feed.all']}">전체</a>
    <a href="/?kind=moment" class="flex-1 min-h-tap rounded-xl flex items-center justify-center font-medium" th:classappend="${kind == 'moment'} ? 'bg-card text-fg shadow-sm' : 'text-muted'" th:text="${L['post.moment']}">순간</a>
    <a href="/?kind=diary" class="flex-1 min-h-tap rounded-xl flex items-center justify-center font-medium" th:classappend="${kind == 'diary'} ? 'bg-card text-fg shadow-sm' : 'text-muted'" th:text="${L['post.diary']}">일기</a>
  </div>
</nav>

<main class="wrap mt-4 space-y-4">
  <div th:if="${posts.isEmpty()}" class="py-20 text-center">
    <p class="text-5xl mb-4">📷</p>
    <p class="font-semibold" th:text="${L['feed.empty']}">아직 글이 없어요</p>
    <a href="/write" class="btn-primary mt-6" th:text="${L['feed.firstPost']}">첫 글 올리기</a>
  </div>
  <th:block th:each="p : ${posts}"><article th:replace="~{fragments/post :: card(${p})}"></article></th:block>
  <a th:if="${hasNext}" th:href="@{/(page=${page + 1}, kind=${kind == 'all' ? null : kind})}" class="btn-soft w-full" th:text="${L['common.more']}">더 보기</a>
</main>
<nav th:replace="~{fragments/layout :: tabbar('home')}"></nav>
</body>
</html>
