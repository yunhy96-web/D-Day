<!DOCTYPE html>
<!-- 공통 조각. 각 화면의 <html> 은 아래 형태로 직접 쓴다(Thymeleaf 조각은 html 속성을 못 바꿈):
  <html th:lang="${lang}" th:attr="data-font=${font},data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'"> -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23CD6246' d='M12 21s-7.5-4.6-9.5-9.2C1.1 8.4 3.3 5 6.8 5c2 0 3.6 1.1 4.4 2.6h1.6C13.6 6.1 15.2 5 17.2 5c3.5 0 5.7 3.4 4.3 6.8C19.5 16.4 12 21 12 21z'/%3E%3C/svg%3E">
  <title th:text="${title != null ? title + ' · ' + familyName : familyName}">가족</title>
  <!-- 테마: system 이면 OS 설정을 따라감. 그리기 전에 실행해 깜빡임 방지 (설계 §7) -->
  <script th:nonce="${nonce}">(function(){var d=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)');function a(){var t=d.dataset.theme;d.classList.toggle('dark',t==='dark'||(t==='system'&&m.matches))}a();m.addEventListener('change',a);window.__applyTheme=a})()</script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link th:if="${lang == 'th'}" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/static/tw.css}">
  <script type="application/json" id="L" th:utext="${Ljson}"></script>
  <script th:src="@{/static/app.js}" defer></script>
</head>
<body>

<!-- 화면 위 줄: 제목 + 오른쪽 저장 표시 -->
<header th:fragment="top(title, back)" class="sticky top-0 z-20 bg-bg/90 backdrop-blur border-b border-line/50">
  <div class="wrap flex items-center gap-2 h-14 font-lg:h-16">
    <a th:if="${back != null}" th:href="${back}" class="-ml-2 p-2 text-fg" th:aria-label="${L['common.back']}">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-lg font-bold truncate flex-1" th:text="${title}">제목</h1>
    <span data-saved class="text-sm text-muted opacity-0 transition-opacity" th:text="${L['common.saved']}">저장됨</span>
  </div>
</header>

<!-- 하단 탭 (설계 §5). 크게 보기에서도 아이콘 옆에 글자를 항상 둔다 -->
<nav th:fragment="tabbar(active)" class="fixed bottom-0 inset-x-0 z-30 bg-card/95 backdrop-blur border-t border-line safe-b">
  <div class="max-w-xl mx-auto grid grid-cols-5 h-16 font-lg:h-[4.2rem]">
    <a href="/" class="flex flex-col items-center justify-center gap-0.5" th:classappend="${active == 'home'} ? 'text-accent' : 'text-muted'">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
      <span class="text-xs font-medium font-lg:text-sm" th:text="${L['tab.home']}">홈</span>
    </a>
    <a href="/album" class="flex flex-col items-center justify-center gap-0.5" th:classappend="${active == 'album'} ? 'text-accent' : 'text-muted'">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
      <span class="text-xs font-medium font-lg:text-sm" th:text="${L['tab.album']}">앨범</span>
    </a>
    <a href="/write" class="flex flex-col items-center justify-center" th:aria-label="${L['tab.write']}">
      <span class="w-12 h-12 font-lg:w-14 font-lg:h-14 -mt-1 rounded-2xl bg-accent text-on-accent flex items-center justify-center shadow-md" th:classappend="${active == 'write'} ? 'ring-4 ring-accent/25'">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </span>
    </a>
    <a href="/calendar" class="flex flex-col items-center justify-center gap-0.5" th:classappend="${active == 'calendar'} ? 'text-accent' : 'text-muted'">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path stroke-linecap="round" d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      <span class="text-xs font-medium font-lg:text-sm" th:text="${L['tab.calendar']}">캘린더</span>
    </a>
    <a href="/me" class="flex flex-col items-center justify-center gap-0.5" th:classappend="${active == 'me'} ? 'text-accent' : 'text-muted'">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span class="text-xs font-medium font-lg:text-sm" th:text="${L['tab.me']}">나</span>
    </a>
  </div>
</nav>

<!-- 로그인 전 화면 오른쪽 위: 언어 · 글씨 · 테마 -->
<div th:fragment="prefbar" class="flex items-center justify-end gap-1 text-sm">
  <button type="button" data-pref="lang" th:value="${lang == 'th' ? 'ko' : 'th'}" class="px-3 h-10 rounded-full bg-soft font-medium" th:text="${lang == 'th' ? '한국어' : 'ภาษาไทย'}">ภาษาไทย</button>
  <button type="button" data-font-cycle class="px-3 h-10 rounded-full bg-soft font-semibold" th:aria-label="${L['me.font']}"><span class="text-xs">가</span><span class="text-base">가</span></button>
  <button type="button" data-theme-cycle class="w-10 h-10 rounded-full bg-soft inline-flex items-center justify-center" th:aria-label="${L['me.theme']}">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
</div>

</body>
</html>
