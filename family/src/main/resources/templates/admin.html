<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-font=${font},data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${L['admin.title']})}"></head>
<body class="pb-tab">
<header th:replace="~{fragments/layout :: top(${L['admin.title']}, '/me')}"></header>
<!-- 설계 §4: 가입 승인·거절, 역할, 차단, 비밀번호 초기화. 바꾸는 즉시 저장 -->
<main class="wrap mt-4 space-y-8">
  <section>
    <h2 class="font-bold text-lg" th:text="${L['admin.pending']}">승인 대기</h2>
    <p th:if="${pending.isEmpty()}" class="mt-2 text-muted" th:text="${L['admin.noPending']}">없어요</p>
    <ul class="mt-3 space-y-3">
      <li th:each="m : ${pending}" class="card p-4" th:attr="data-member=${m.id}">
        <p class="font-semibold"><span th:text="${m.name}">이름</span> <span class="text-muted font-normal" th:text="'@' + ${m.login_id}">@id</span></p>
        <p class="text-sm text-muted" th:text="${f.dateTime(m.created_at.replace(' ', 'T') + (m.created_at.endsWith('Z') ? '' : 'Z'))}">시각</p>
        <div class="mt-3 flex gap-2">
          <button type="button" data-approve class="btn-primary flex-1" th:text="${L['admin.approve']}">승인</button>
          <button type="button" data-reject class="btn-line flex-1" th:text="${L['admin.reject']}">거절</button>
        </div>
      </li>
    </ul>
  </section>

  <section>
    <h2 class="font-bold text-lg" th:text="${L['admin.members']}">가족</h2>
    <ul class="mt-3 space-y-3">
      <li th:each="m : ${members}" class="card p-4" th:attr="data-member=${m.id}" th:with="roleList=${m.roles == null ? '' : ',' + m.roles + ','}">
        <div class="flex items-center gap-3">
          <span class="avatar solid w-10 h-10" th:classappend="'c-' + ${m.color}" th:text="${#strings.substring(m.name, 0, 1)}">아</span>
          <div class="flex-1 min-w-0">
            <p class="font-semibold truncate"><span th:text="${m.name}">이름</span> <span class="text-muted font-normal text-sm" th:text="'@' + ${m.login_id}">@id</span></p>
            <p class="text-sm" th:classappend="${m.status == 'BLOCKED'} ? 'text-red-600' : 'text-muted'"
               th:text="${m.status == 'BLOCKED'} ? ${L['admin.blocked']} : (${m.last_seen_at != null} ? ${L['admin.lastSeen']} + ' ' + ${f.dateTime(m.last_seen_at)} : '')"></p>
          </div>
        </div>
        <div th:if="${canRoles}" class="mt-3 flex flex-wrap gap-2">
          <label th:each="r : ${roles}" class="inline-flex items-center gap-2 px-3 min-h-tap rounded-xl bg-soft cursor-pointer">
            <input type="checkbox" data-role th:value="${r}" class="w-5 h-5 accent-[rgb(var(--accent))]" th:checked="${roleList.contains(',' + r + ',')}"
                   th:disabled="${m.id == me.memberId and r == 'ADMIN'}">
            <span th:text="${L['role.' + r]}">역할</span>
          </label>
        </div>
        <div th:if="${canManage and m.id != me.memberId}" class="mt-3 flex gap-2">
          <button type="button" data-reset class="btn-line flex-1 text-sm" th:text="${L['admin.resetPw']}">비밀번호 초기화</button>
          <button type="button" th:attr="data-status=${m.status == 'BLOCKED' ? 'ACTIVE' : 'BLOCKED'}" class="btn-line flex-1 text-sm"
                  th:classappend="${m.status != 'BLOCKED'} ? 'text-red-600'" th:text="${m.status == 'BLOCKED'} ? ${L['admin.unblock']} : ${L['admin.block']}">차단</button>
        </div>
        <p data-temp class="mt-3 hidden px-4 py-3 rounded-xl bg-soft"></p>
      </li>
    </ul>
  </section>
  <a href="/calendar" class="btn-soft w-full" th:text="${L['admin.editShifts']}">가족 근무표 대신 입력</a>
</main>
<nav th:replace="~{fragments/layout :: tabbar('me')}"></nav>
<script th:src="@{/static/admin.js}" defer></script>
</body>
</html>
