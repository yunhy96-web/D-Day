<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${L['admin.tab.password']})}"></head>
<body>
<header th:replace="~{fragments/admin :: nav}"></header>
<main class="max-w-md mx-auto px-4 py-10">
  <h1 class="text-xl font-bold" th:text="${L['admin.tab.password']}">비밀번호 변경</h1>
  <p class="text-sm text-muted mt-1 mb-6" th:text="${L['admin.password.sub']}">다른 기기는 로그아웃돼요</p>
  <form data-form="/admin/api/password" data-method="PUT" data-next="/admin/password?done" class="card p-5 space-y-3">
    <input type="text" name="username" value="sunflower" autocomplete="username" class="hidden" disabled>
    <div><label class="label" th:text="${L['admin.password.current']}">현재 비밀번호</label><input name="current" type="password" class="field" autocomplete="current-password" required></div>
    <div><label class="label" th:text="${L['admin.password.next']}">새 비밀번호</label><input name="next" type="password" class="field" autocomplete="new-password" minlength="8" required></div>
    <div><label class="label" th:text="${L['admin.password.confirm']}">확인</label><input name="confirm" type="password" class="field" autocomplete="new-password" minlength="8" required></div>
    <button class="btn-primary w-full" th:text="${L['common.save']}">저장</button>
  </form>
  <p th:if="${param.done != null}" class="mt-4 text-center font-semibold text-leaf" th:text="${L['admin.password.done']}">바꿨어요</p>
</main>
<script th:src="@{/static/admin.js}" defer></script>
</body>
</html>
