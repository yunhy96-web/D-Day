<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${L['admin.tab.codes']})}"></head>
<body>
<header th:replace="~{fragments/admin :: nav}"></header>
<main class="max-w-6xl mx-auto px-4 py-6">
  <div class="flex items-center gap-2 mb-1">
    <h1 class="text-xl font-bold mr-auto" th:text="${L['admin.tab.codes']}">카테고리·코드</h1>
    <a href="/admin/codes?root=CATEGORY" class="chip" th:classappend="${root == 'CATEGORY'} ? 'bg-accent text-on-accent'" th:text="${L['admin.codes.category']}">카테고리·옵션</a>
    <a href="/admin/codes?root=REGION" class="chip" th:classappend="${root == 'REGION'} ? 'bg-accent text-on-accent'" th:text="${L['admin.codes.region']}">지역</a>
  </div>
  <p class="text-sm text-muted mb-1" th:text="${L['admin.codes.sub']}">이름·순서·사용 여부는 바꾸면 바로 저장</p>
  <p th:if="${root == 'CATEGORY'}" class="text-sm text-muted mb-4" th:text="${L['admin.codes.treeRule']}">카테고리는 하위 카테고리 또는 옵션 그룹 중 하나만</p>
  <!-- 최상위 공간 탭 -->
  <div th:if="${root == 'CATEGORY'}" class="flex flex-wrap gap-2 mb-3">
    <a th:each="sp : ${spaces}" th:href="@{/admin/codes(under=${sp.code})}" class="chip h-10 px-4"
       th:classappend="${(under == sp.code ? 'bg-accent text-on-accent' : '') + (sp.use ? '' : ' opacity-50')}">
      <span th:text="${sp.icon}"></span><span th:text="${f.n(sp.code)}"></span></a>
    <button type="button" data-add-reset class="chip h-10 px-4 border border-dashed border-line bg-card" th:text="${L['admin.codes.addSpace']}">+ 공간</button>
  </div>

  <div class="card overflow-x-auto">
    <table class="tbl">
      <thead><tr><th th:text="${L['admin.code']}">코드</th><th th:if="${root == 'CATEGORY'}" th:text="${L['admin.icon']}">아이콘</th>
        <th>한국어</th><th>English</th><th th:if="${root == 'CATEGORY'}" th:text="${L['admin.keywords']}">검색어</th><th th:text="${L['admin.sort']}">순서</th><th th:text="${L['admin.use']}">사용</th><th></th></tr></thead>
      <tbody>
      <tr th:each="n : ${tree}" th:with="c=${n.code}, api=${'/admin/api/codes/' + n.code.code}, isCat=${n.code.group == 'CATEGORY'}"
          th:classappend="${!c.use} ? 'opacity-50'">
        <td class="whitespace-nowrap font-mono text-xs"
            th:classappend="${n.depth == 1} ? '!pl-8' : (${n.depth == 2} ? '!pl-14' : (${n.depth >= 3} ? '!pl-20' : ''))">
          <span class="badge mr-1" th:classappend="${isCat} ? 'bg-accent text-on-accent' : 'bg-soft text-muted'"
                th:text="${L['admin.group.' + c.group]}">카테고리</span><span th:classappend="${isCat} ? 'font-bold text-sm'" th:text="${c.code}"></span></td>
        <td th:if="${root == 'CATEGORY'}"><input th:if="${isCat}" class="field-sm w-14 text-center text-lg" maxlength="8" data-field="icon" th:attr="data-put=${api}" th:value="${c.icon}"></td>
        <td><input class="field-sm min-w-[8rem]" data-field="ko" th:attr="data-put=${api}" th:value="${ko['code.' + c.code]}"></td>
        <td><input class="field-sm min-w-[8rem]" data-field="en" th:attr="data-put=${api}" th:value="${en['code.' + c.code]}"></td>
        <td th:if="${root == 'CATEGORY'}" class="min-w-[16rem]">
          <th:block th:if="${isCat && !n.hasSubs}">
            <input class="field-sm mb-1" data-field="kwKo" th:attr="data-put=${api}" th:value="${ko['kw.' + c.code]}" th:placeholder="${L['admin.keywordsPh']}">
            <input class="field-sm" data-field="kwEn" th:attr="data-put=${api}" th:value="${en['kw.' + c.code]}" placeholder="English">
          </th:block>
        </td>
        <td><input class="field-sm w-16" type="number" data-type="int" data-field="sort" th:attr="data-put=${api}" th:value="${c.sort}"></td>
        <td><input type="checkbox" class="w-4 h-4 accent-amber-500" data-field="useYn" th:attr="data-put=${api}" th:checked="${c.use}"></td>
        <td class="whitespace-nowrap space-x-1">
          <button type="button" th:if="${isCat && !n.hasOptions}" class="btn-line btn-sm" data-add-child th:attr="data-parent=${c.code}" data-child="CATEGORY" th:text="${L['admin.codes.addSub']}">+ 하위 카테고리</button>
          <button type="button" th:if="${isCat && !n.hasSubs}" class="btn-line btn-sm" data-add-child th:attr="data-parent=${c.code}" data-child="OPT_GROUP" th:text="${L['admin.codes.addGroup']}">+ 옵션 그룹</button>
          <button type="button" th:if="${c.group == 'OPT_GROUP' || c.group == 'REGION'}" class="btn-line btn-sm" data-add-child th:attr="data-parent=${c.code}" data-child="" th:text="${L['admin.codes.addChild']}">+ 하위</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- 추가. 부모를 비우면 최상위(카테고리 탭이면 공간) -->
  <form data-form="/admin/api/codes" data-add-form class="card p-5 mt-6 space-y-3">
    <h2 class="font-bold"><span th:text="${L['admin.codes.add']}">추가</span> · <span data-add-kind th:text="${L['admin.codes.addRoot']}">최상위</span></h2>
    <input type="hidden" name="rootGroup" th:value="${root}">
    <input type="hidden" name="childGroup">
    <div class="grid sm:grid-cols-[1fr_1fr_5rem_1fr_1fr_auto] gap-2 items-end">
      <div><label class="label" th:text="${L['admin.codes.parent']}">부모 코드</label><input name="parentCode" class="field-sm font-mono bg-soft" readonly th:placeholder="${L['admin.codes.root']}"></div>
      <div><label class="label" th:text="${L['admin.code']}">코드</label><input name="code" class="field-sm font-mono uppercase" placeholder="BATHROOM_SINK" required></div>
      <div><label class="label" th:text="${L['admin.icon']}">아이콘</label><input name="icon" class="field-sm text-center" maxlength="8" placeholder="🔧"></div>
      <div><label class="label">한국어</label><input name="ko" class="field-sm" required></div>
      <div><label class="label">English</label><input name="en" class="field-sm"></div>
      <button class="btn-primary btn-sm" th:text="${L['admin.codes.add']}">추가</button>
    </div>
    <button type="button" data-add-reset class="link text-sm" th:text="${L['admin.codes.resetRoot']}">최상위에 추가하기로</button>
  </form>
</main>
<script th:src="@{/static/admin.js}" defer></script>
<script th:src="@{/static/codes.js}" defer></script>
</body>
</html>
