<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'"
      th:with="vname=${lang == 'en' && v.name_en != null ? v.name_en : v.name}">
<head th:replace="~{fragments/layout :: head(${vname})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap max-w-3xl pt-6">
  <section class="card p-6">
    <span th:if="${v.sample_yn == 'Y'}" class="badge bg-soft text-muted" th:text="${L['common.sample']}">예시</span>
    <h1 class="text-2xl font-extrabold mt-1" th:text="${vname}">업체</h1>
    <p class="text-muted mt-1" th:text="${v.address}">주소</p>
    <p th:if="${v.intro}" class="mt-4 whitespace-pre-line" th:text="${v.intro}">소개</p>
    <div th:replace="~{fragments/layout :: conds(${v.vat}, ${v.trip_fee}, ${v.fail_fee}, ${v.surcharge}, ${v.extra_note})}"></div>
    <div class="mt-4 flex flex-wrap gap-1.5">
      <span class="text-sm text-muted mr-1" th:text="${L['vendor.regions']}">출장 지역</span>
      <span th:each="r : ${regions}" class="chip" th:text="${f.n(r)}">서울</span>
    </div>
    <div class="mt-5 flex flex-wrap gap-2">
      <a th:if="${v.phone}" th:href="'tel:' + ${v.phone}" class="btn-line btn-sm" th:text="${L['result.call']} + ' ' + ${v.phone}">전화</a>
      <a th:href="'https://map.kakao.com/link/search/' + ${#uris.escapePathSegment(v.address)}" target="_blank" rel="noopener" class="btn-line btn-sm" th:text="${L['result.map']}">지도</a>
    </div>
  </section>

  <h2 class="text-lg font-bold mt-8 mb-3" th:text="${L['vendor.priceTable']}">가격표</h2>
  <section th:each="c : ${cats}" class="card p-5 mb-3">
    <div class="flex items-center justify-between">
      <h3 class="font-bold flex items-center gap-2"><span th:replace="~{fragments/layout :: icon(${c})}"></span><span th:text="${f.path(c.code)}">도배</span></h3>
      <a th:href="@{'/c/' + ${c.code}}" class="link text-sm" th:text="${L['vendor.compare']}">다른 업체와 비교</a>
    </div>
    <dl class="mt-3 grid grid-cols-[1fr_auto] gap-x-4 gap-y-1 text-sm">
      <dt class="font-semibold" th:text="${L['result.base']}">기본가</dt>
      <dd class="text-right font-semibold" th:classappend="${basePrices[c.code] == null} ? 'text-muted'" th:text="${f.won(basePrices[c.code])}"></dd>
      <th:block th:each="g : ${groups[c.code]}">
        <dt class="col-span-2 mt-2 text-muted text-xs" th:text="${f.n(g.group.code)}">면적</dt>
        <th:block th:each="o : ${g.options}">
          <dt th:text="${f.n(o.code)}"></dt>
          <dd class="text-right" th:classappend="${optPrices[o.code] == null} ? 'text-muted'" th:text="${optPrices[o.code] == null ? L['price.hidden'] : '+ ' + f.won(optPrices[o.code])}"></dd>
        </th:block>
      </th:block>
    </dl>
  </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
