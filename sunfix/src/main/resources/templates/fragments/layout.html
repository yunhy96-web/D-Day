<!DOCTYPE html>
<!-- 공통 조각. 각 화면 <html> 은 직접 쓴다:
  <html th:lang="${lang}" th:attr="data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'"> -->
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF0">
  <meta name="description" th:content="${L['home.sub']}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23F5A623'%3E%3Cellipse cx='16' cy='5' rx='4' ry='5'/%3E%3Cellipse cx='16' cy='27' rx='4' ry='5'/%3E%3Cellipse cx='5' cy='16' rx='5' ry='4'/%3E%3Cellipse cx='27' cy='16' rx='5' ry='4'/%3E%3Cellipse cx='8' cy='8' rx='4' ry='5' transform='rotate(-45 8 8)'/%3E%3Cellipse cx='24' cy='24' rx='4' ry='5' transform='rotate(-45 24 24)'/%3E%3Cellipse cx='24' cy='8' rx='4' ry='5' transform='rotate(45 24 8)'/%3E%3Cellipse cx='8' cy='24' rx='4' ry='5' transform='rotate(45 8 24)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='7' fill='%236B4423'/%3E%3C/svg%3E">
  <title th:text="${title != null ? title + ' · Sunfix' : 'Sunfix'}">Sunfix</title>
  <!-- 테마: system 이면 OS 설정을 따라감. 그리기 전에 실행해 깜빡임 방지 -->
  <script th:nonce="${nonce}">(function(){var d=document.documentElement,m=matchMedia('(prefers-color-scheme: dark)');function a(){var t=d.dataset.theme;d.classList.toggle('dark',t==='dark'||(t==='system'&&m.matches))}a();m.addEventListener('change',a)})()</script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/static/tw.css}">
  <script type="application/json" id="L" th:utext="${Ljson}"></script>
  <script th:src="@{/static/app.js}" defer></script>
</head>
<body>

<!-- 해바라기 로고 -->
<svg th:fragment="logo(cls)" th:class="${cls}" viewBox="0 0 32 32" aria-hidden="true">
  <g class="fill-accent">
    <ellipse cx="16" cy="5" rx="4" ry="5"/><ellipse cx="16" cy="27" rx="4" ry="5"/><ellipse cx="5" cy="16" rx="5" ry="4"/><ellipse cx="27" cy="16" rx="5" ry="4"/>
    <ellipse cx="8" cy="8" rx="4" ry="5" transform="rotate(-45 8 8)"/><ellipse cx="24" cy="24" rx="4" ry="5" transform="rotate(-45 24 24)"/>
    <ellipse cx="24" cy="8" rx="4" ry="5" transform="rotate(45 24 8)"/><ellipse cx="8" cy="24" rx="4" ry="5" transform="rotate(45 8 24)"/>
  </g>
  <circle cx="16" cy="16" r="7" fill="#6B4423"/>
</svg>

<header th:fragment="header" class="sticky top-0 z-30 bg-bg/90 backdrop-blur border-b border-line/60">
  <div class="wrap flex items-center gap-2 h-14">
    <a href="/" class="flex items-center gap-2 font-extrabold text-lg tracking-tight mr-auto">
      <svg th:replace="~{fragments/layout :: logo('w-7 h-7')}"></svg>Sunfix
    </a>
    <a href="/report" class="hidden sm:inline-flex btn-sm btn-soft" th:text="${L['nav.report']}">견적 제보</a>
    <button type="button" data-lang th:value="${lang == 'en' ? 'ko' : 'en'}" class="h-9 px-3 rounded-xl bg-soft text-sm font-semibold" th:text="${lang == 'en' ? '한국어' : 'EN'}">EN</button>
    <button type="button" data-theme-cycle class="w-9 h-9 rounded-xl bg-soft inline-flex items-center justify-center" th:aria-label="${L['nav.theme']}">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</header>

<footer th:fragment="footer" class="mt-16 border-t border-line/60 safe-b">
  <div class="wrap py-8 text-sm text-muted space-y-2">
    <p class="flex items-center gap-2 font-semibold text-fg"><svg th:replace="~{fragments/layout :: logo('w-5 h-5')}"></svg><span th:text="${L['footer.operator']}">운영 Sunflower</span></p>
    <p th:text="${L['footer.sample']}">업체·가격은 포트폴리오용 예시 데이터입니다.</p>
    <p><a href="/admin" class="hover:underline" th:text="${L['footer.admin']}">관리자</a></p>
  </div>
</footer>

<!-- 카테고리 아이콘 -->
<span th:fragment="icon(code)" class="text-3xl leading-none" aria-hidden="true" th:switch="${code}">
  <th:block th:case="'WALLPAPER'">🧻</th:block><th:block th:case="'FLOOR'">🪵</th:block><th:block th:case="'BATH'">🛁</th:block>
  <th:block th:case="'LEAK'">💧</th:block><th:block th:case="'AIRCON'">❄️</th:block><th:block th:case="'BOILER'">🔥</th:block>
  <th:block th:case="'GROUT'">🧱</th:block><th:block th:case="'SCREEN'">🪟</th:block><th:block th:case="*">🔧</th:block>
</span>

<!-- 제보 한 줄 -->
<li th:fragment="report(r)" class="py-3 flex items-start gap-3">
  <div class="flex-1 min-w-0">
    <p class="font-semibold"><span th:text="${f.n(r.categoryCode)}">도배</span> · <span class="text-muted font-normal" th:text="${f.n(r.regionCode)}">강남구</span></p>
    <p class="text-sm text-muted truncate"><th:block th:each="o, st : ${r.options}"><span th:text="${f.n(o.code)}"></span><th:block th:unless="${st.last}"> · </th:block></th:block></p>
    <p class="text-xs text-muted mt-0.5">
      <span th:text="${r.vendorName != null ? r.vendorName : L['report.unregistered']}">미등록 업체</span> · <span th:text="${r.ym}">2026-10</span>
      <th:block th:if="${r.memo != null}"> · “<span th:text="${r.memo}"></span>”</th:block>
    </p>
  </div>
  <p class="font-bold whitespace-nowrap" th:text="${f.won(r.price)}">1,000,000원</p>
</li>

</body>
</html>
