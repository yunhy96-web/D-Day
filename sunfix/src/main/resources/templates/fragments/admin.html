<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav" class="sticky top-0 z-30 bg-card border-b border-line">
  <div class="max-w-6xl mx-auto px-4 flex items-center gap-1 h-14 overflow-x-auto no-scrollbar">
    <a href="/admin" class="flex items-center gap-2 font-extrabold mr-3 shrink-0"><svg th:replace="~{fragments/layout :: logo('w-6 h-6')}"></svg>Sunfix</a>
    <a th:each="t : ${ {'reports','inquiries','vendors','codes','labels'} }" th:href="'/admin/' + ${t}"
       class="px-3 h-9 inline-flex items-center rounded-xl text-sm font-semibold shrink-0"
       th:classappend="${tab == t} ? 'bg-accent text-on-accent' : 'text-muted hover:bg-soft'" th:text="${L['admin.tab.' + t]}">탭</a>
    <span class="flex-1"></span>
    <button type="button" data-lang th:value="${lang == 'en' ? 'ko' : 'en'}" class="h-9 px-3 rounded-xl bg-soft text-sm font-semibold shrink-0" th:text="${lang == 'en' ? '한국어' : 'EN'}">EN</button>
    <a href="/" class="h-9 px-3 inline-flex items-center rounded-xl text-sm text-muted hover:bg-soft shrink-0" th:text="${L['admin.site']}">사이트</a>
    <a href="/admin/password" class="h-9 px-3 inline-flex items-center rounded-xl text-sm shrink-0" th:classappend="${tab == 'password'} ? 'bg-soft text-fg' : 'text-muted hover:bg-soft'" th:text="${L['admin.tab.password']}">비밀번호</a>
    <button type="button" data-logout class="h-9 px-3 rounded-xl text-sm text-muted hover:bg-soft shrink-0" th:text="${L['admin.logout']}">로그아웃</button>
  </div>
</header>
</body>
</html>
