<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${f.n(cat.code)})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap max-w-3xl pt-6 pb-32">
  <nav th:replace="~{fragments/layout :: crumbs(${path})}"></nav>
  <div class="flex items-center gap-3 mt-3 mb-8">
    <span th:replace="~{fragments/layout :: icon(${cat})}"></span>
    <div>
      <h1 class="text-2xl font-extrabold" th:text="${f.n(cat.code)}">도배</h1>
      <p class="text-muted text-sm" th:text="${L['pick.sub']}">조건을 고르면 업체별 총액을 바로 비교해요</p>
    </div>
  </div>
  <form data-compare th:action="@{'/c/' + ${cat.code} + '/result'}" novalidate>
    <div th:replace="~{fragments/pick :: pick}"></div>
    <!-- 하단 고정 바 -->
    <div class="fixed bottom-0 inset-x-0 z-30 bg-card/95 backdrop-blur border-t border-line safe-b">
      <div class="wrap max-w-3xl py-3 flex items-center gap-3">
        <p class="flex-1 text-sm"><span class="text-muted" th:text="${L['pick.matching']}">조건에 맞는 업체</span>
          <b class="text-lg" data-count>–</b></p>
        <button class="btn-primary" data-submit disabled th:text="${L['pick.compare']}">비교하기</button>
      </div>
    </div>
  </form>
</main>
<script th:src="@{/static/pick.js}" defer></script>
</body>
</html>
