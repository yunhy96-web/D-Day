<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:attr="data-theme=${theme}" th:classappend="${theme == 'dark'} ? 'dark'">
<head th:replace="~{fragments/layout :: head(${f.n(cat.code)})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap max-w-3xl pt-6">
  <nav th:replace="~{fragments/layout :: crumbs(${path})}"></nav>
  <div class="flex items-center gap-3 mt-3 mb-6">
    <span th:replace="~{fragments/layout :: icon(${cat})}"></span>
    <div>
      <h1 class="text-2xl font-extrabold" th:text="${f.n(cat.code)}">욕실·화장실</h1>
      <p class="text-muted text-sm" th:text="${L['cat.sub']}">어떤 부분을 고치세요?</p>
    </div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
    <a th:each="c : ${subs}" th:href="@{'/c/' + ${c.code}(sido=${sido})}" class="card p-4 flex flex-col gap-3 hover:border-accent transition">
      <span th:replace="~{fragments/layout :: icon(${c})}"></span>
      <span class="font-bold text-lg" th:text="${f.n(c.code)}">배수구 막힘</span>
      <span class="text-sm text-muted" th:text="${f.t('home.vendorsN', counts[c.code])}">업체 5곳</span>
    </a>
  </div>
  <p th:if="${subs.isEmpty()}" class="card p-8 text-center text-muted" th:text="${L['cat.empty']}">아직 준비 중이에요</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
