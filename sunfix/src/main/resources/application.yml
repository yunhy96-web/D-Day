app:
  data-dir: ${APP_DATA_DIR:./data}
  base-url: ${SUNFIX_BASE_URL:}                  # 운영 https://sunfix.union-selim.com. Origin 검사용, 비면 Host 와 비교
  cookie-secure: ${COOKIE_SECURE:false}
  admin-login-id: ${ADMIN_LOGIN_ID:sunflower}
  admin-pw-hash: ${ADMIN_PW_HASH:}

spring:
  datasource:
    url: jdbc:sqlite:${app.data-dir}/sunfix.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      enabled: false
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
