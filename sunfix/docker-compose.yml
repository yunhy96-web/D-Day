# Pi 배포. docker-compose up -d --build
# 외부 노출은 tut-cloudflared ingress(sunfix.thaiuniontour.com → http://sunfix-app:8080) 로만.
services:
  app:
    build: .
    image: sunfix-app
    container_name: sunfix-app
    env_file: .env
    environment:
      APP_DATA_DIR: /data
      COOKIE_SECURE: "true"
      SUNFIX_BASE_URL: https://sunfix.thaiuniontour.com
    volumes: ["./data:/data"]
    networks: [docker_default]
    read_only: true
    tmpfs: ["/tmp:rw,exec,size=64m"]   # sqlite-jdbc 가 네이티브 .so 를 /tmp 에 풀어 로드한다
    cap_drop: [ALL]
    mem_limit: 512m
    restart: always
networks:
  docker_default:
    external: true
