<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>일정 관리</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        h1 { margin-bottom: 16px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 32px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f5f5f5; }
        a { color: #1a73e8; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 16px; }
        .btn { padding: 8px 18px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .btn:hover { background: #1558b0; }
        h2 { margin-bottom: 12px; }
        .form-row { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input[type=date], input[type=number], select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/admin">홈</a> &gt; <a href="/admin/products">상품 관리</a> &gt; 일정 관리
</div>
<h1 th:text="'[' + ${product.name} + '] 날짜별 일정'">일정 관리</h1>

<table>
    <thead>
        <tr>
            <th>날짜</th>
            <th>재고</th>
            <th>가격 (원)</th>
            <th>상태</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="s : ${schedules}">
            <td th:text="${s.saleDate}">2025-01-01</td>
            <td th:text="${s.stock != null} ? ${s.stock} : '무제한'">10</td>
            <td th:text="${#numbers.formatInteger(s.price, 0, 'COMMA')}">0</td>
            <td th:text="${s.status}">OPEN</td>
        </tr>
        <tr th:if="${#lists.isEmpty(schedules)}">
            <td colspan="4" style="text-align:center;color:#888;">등록된 일정이 없습니다.</td>
        </tr>
    </tbody>
</table>

<h2>일정 추가</h2>
<form th:action="@{/admin/products/{productId}/schedules(productId=${product.id})}"
      th:object="${form}" method="post">
    <div class="form-row">
        <label for="saleDate">날짜 *</label>
        <input type="date" id="saleDate" th:field="*{saleDate}"/>
    </div>
    <div class="form-row">
        <label for="stock">재고 (빈값=무제한)</label>
        <input type="number" id="stock" th:field="*{stock}" min="0" placeholder="무제한"/>
    </div>
    <div class="form-row">
        <label for="price">가격 (원) *</label>
        <input type="number" id="price" th:field="*{price}" min="0" placeholder="0"/>
    </div>
    <div class="form-row">
        <label for="status">상태 *</label>
        <select id="status" th:field="*{status}">
            <option th:each="s : ${scheduleStatuses}" th:value="${s}" th:text="${s}">OPEN</option>
        </select>
    </div>
    <button class="btn" type="submit">추가</button>
</form>
</body>
</html>
