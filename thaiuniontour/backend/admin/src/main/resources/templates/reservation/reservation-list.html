<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>예약/입금 승인</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        h1 { margin-bottom: 16px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f5f5f5; }
        a { color: #1a73e8; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 16px; }
        .filter { margin-bottom: 16px; }
        .btn { display: inline-block; padding: 4px 10px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        .btn:hover { background: #1558b0; }
        .btn-cancel { display: inline-block; padding: 4px 10px; background: #d32f2f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        .btn-cancel:hover { background: #b71c1c; }
        .status-PENDING { color: #e65100; font-weight: bold; }
        .status-CONFIRMED { color: #2e7d32; font-weight: bold; }
        .status-CANCELLED { color: #757575; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/admin">홈</a> &gt; 예약/입금 승인
</div>
<h1>예약 목록</h1>

<div class="filter">
    필터:
    <a th:href="@{/admin/reservations}" th:classappend="${filterStatus == 'ALL'} ? ' font-weight:bold'">전체</a>
    &nbsp;|&nbsp;
    <a th:href="@{/admin/reservations(status='PENDING')}">PENDING(입금대기)</a>
</div>

<table>
    <thead>
        <tr>
            <th>예약번호</th>
            <th>상품ID</th>
            <th>예약자</th>
            <th>금액 (원)</th>
            <th>상태</th>
            <th>입금기한</th>
            <th>생성일</th>
            <th>작업</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="r : ${reservations}">
            <td th:text="${r.reservationNo}">TUT-XXXXXXX</td>
            <td th:text="${r.productId}">uuid</td>
            <td th:text="${r.reserverName + ' / ' + r.reserverEmail}">홍길동</td>
            <td th:text="${#numbers.formatInteger(r.amount, 0, 'COMMA')}">0</td>
            <td>
                <span th:text="${r.status}"
                      th:classappend="${'status-' + r.status}">PENDING</span>
            </td>
            <td th:text="${r.paymentDeadline != null} ? ${#temporals.format(r.paymentDeadline, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
            <td th:text="${r.createdAt != null} ? ${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
            <td>
                <form th:if="${r.status.name() == 'PENDING'}"
                      th:action="@{/admin/reservations/{id}/confirm(id=${r.id})}"
                      method="post" style="display:inline;">
                    <button class="btn" type="submit">입금 승인</button>
                </form>
                <form th:if="${r.status.name() == 'PENDING' or r.status.name() == 'CONFIRMED'}"
                      th:action="@{/admin/reservations/{id}/cancel(id=${r.id})}"
                      method="post" style="display:inline;"
                      onsubmit="return confirm('취소하시겠습니까?')">
                    <button class="btn-cancel" type="submit">취소</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservations)}">
            <td colspan="8" style="text-align:center;color:#888;">예약이 없습니다.</td>
        </tr>
    </tbody>
</table>
</body>
</html>
