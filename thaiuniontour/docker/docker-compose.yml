# 로컬 개발용 인프라 (M0.2). DB·Redis만 컨테이너로 띄우고 backend/frontend는 로컬 실행.
# 앱 컨테이너(backend-api/admin·frontend·nginx)는 M3.7에서 추가 (06-infra.md 참조).
services:
  postgres:
    image: postgres:16-alpine
    container_name: tut-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-thaiuniontour}
      POSTGRES_USER: ${DB_USER:-tut}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tutpass}
    ports:
      - "5433:5432"   # 호스트 5433 (다른 프로젝트의 5432 충돌 회피)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tut} -d ${DB_NAME:-thaiuniontour}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tut-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"   # 호스트 6380 (다른 프로젝트의 6379 충돌 회피)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
